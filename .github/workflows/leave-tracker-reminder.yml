name: Leave Tracker Reminder

# Moved to vercel.json as a Vercel Cron on 2026-09-03. GitHub's scheduler was
# the worse of the two on this project's own record: of the three monthly runs
# it owed, it delivered two -- both roughly 3h20m late (1:15pm and 1:23pm for a
# 10:00am schedule) -- and silently skipped 2026-09-03 entirely, which is a
# whole month's reminder lost. Vercel's Hobby crons land inside an hour.
#
# The schedule trigger is removed rather than left alongside the Vercel one, so
# the two cannot both fire and send the group a duplicate. Manual dispatch stays
# for on-demand runs.
#
# (The old comment here claimed 12:00 PM IST / 06:30 UTC. It was wrong: the cron
# was '30 4' = 04:30 UTC = 10:00 AM IST, which is what the run history shows.)
on:
  workflow_dispatch: {}  # allow manual fire from Actions tab

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send leave tracker reminder to WhatsApp group
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL:     ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret not set — skipping"; exit 0
          fi
          CLEAN_URL=$(printf '%s' "${APP_URL}" | tr -d '[:space:]')
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CLEAN_URL%/}/api/cron/leave-tracker-reminder"
